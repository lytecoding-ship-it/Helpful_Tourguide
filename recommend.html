<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recommended Places</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/recommend.css">
</head>
<body>

  <section class="recommend py-5">
    <div class="container">

      <h2 class="text-center mb-4">Recommendations</h2>

      <div class="row">
        <div class="col-md-4">
          <img src="images/angkor.jpg" class="place-img" alt="Angkor Wat, Siem Reap">
          <p class="place-name">Siem Reap, Cambodia</p>
        </div>
        <div class="col-md-4">
          <img src="images/bali.jpg" class="place-img" alt="Beach in Bali">
          <p class="place-name">Bali, Indonesia</p>
        </div>
        <div class="col-md-4">
          <img src="images/Centralmarket.jpg" class="place-img" alt="Central Market, Phnom Penh">
          <p class="place-name">Central Market, Phnom Penh</p>
        </div>
      </div>

      <h3 class="text-center mt-5 mb-3">Search Tour</h3>
      <form class="search-box row justify-content-center">
        <div class="col-md-3">
          <select class="form-select">
            <option>Destination</option>
            <option>Bali</option>
            <option>Siem Reap</option>
            <option>Central Market</option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="date" class="form-control">
        </div>
        <div class="col-md-3">
          <select class="form-select">
            <option>Travelers</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4+</option>
          </select>
        </div>
        <div class="col-md-2">
          <button type="button" class="btn btn-primary w-100">Search</button>
        </div>
      </form>

    </div>
  </section>

</body>
</html>
